name: Firmware

on:
  push:
    paths:
      - "firmware/**"
      - "protocol/**"
      - "scripts/check_version.sh"
      - "scripts/package_firmware.sh"
      - "VERSION"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "protocol/**"
      - "scripts/check_version.sh"
      - "scripts/package_firmware.sh"
      - "VERSION"
      - ".github/workflows/firmware.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "platformio==6.1.19"
      - id: version
        name: Check repository version
        run: echo "version=$(bash scripts/check_version.sh)" >> "$GITHUB_OUTPUT"
      - name: Build and package firmware
        run: bash scripts/package_firmware.sh
      - name: Protocol host test
        run: |
          c++ -std=c++17 -Ifirmware/src \
            firmware/test/papermono_nfc_protocol_test.cpp \
            -o /tmp/paper_mono_protocol_test
          /tmp/paper_mono_protocol_test
      - run: python -m json.tool protocol/test_vectors.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: paper-mono-firmware-v${{ steps.version.outputs.version }}
          path: dist/v${{ steps.version.outputs.version }}/
          if-no-files-found: error
          retention-days: 14
